name: Regression gate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Tests, PDF pagination and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Chinese print fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run check
      - name: Save PDF output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-regression-output
          path: test-results/pdf/
          if-no-files-found: ignore
          retention-days: 7
